name: geo_attendance
description: Secure geofenced attendance application backed by Google Sheets and Google Drive.
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  geolocator: ^14.1.1
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
