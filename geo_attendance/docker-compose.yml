services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: attendance
      POSTGRES_USER: attendance
      POSTGRES_PASSWORD: change_this_password
    volumes:
      - attendance_pg:/var/lib/postgresql/data

  backend:
    build: ./backend
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+psycopg://attendance:change_this_password@db:5432/attendance
      JWT_SECRET: change_this_to_a_long_random_secret
      WORKSITE_NAME: Main Worksite
      WORKSITE_LATITUDE: 0.0
      WORKSITE_LONGITUDE: 0.0
      WORKSITE_RADIUS_METERS: 50
      MAX_LOCATION_ACCURACY_METERS: 35
      BOOTSTRAP_EMPLOYEE_CODE: EMP001
      BOOTSTRAP_EMPLOYEE_NAME: Demo Employee
      BOOTSTRAP_EMPLOYEE_PIN: ChangeMe1234
    ports:
      - "8000:8000"

volumes:
  attendance_pg:
