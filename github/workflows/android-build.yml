name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Backend base URL, e.g. https://attendance.example.com'
        required: true
        default: 'https://example.com'
  push:
    branches: [ main ]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --org com.geoattendance --project-name geo_attendance .

      - name: Apply Android permissions and app label
        run: python scripts/prepare_android.py

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Resolve API URL
        id: api
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            URL="${{ inputs.api_base_url }}"
          else
            URL="${{ vars.API_BASE_URL }}"
          fi
          if [ -z "$URL" ]; then
            URL="https://example.com"
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: flutter build apk --release --dart-define=API_BASE_URL=${{ steps.api.outputs.url }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: geo-attendance-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
