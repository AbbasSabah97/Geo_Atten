name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      google_script_url:
        description: 'Deployed Google Apps Script URL ending with /exec'
        required: true
  push:
    branches: [ main ]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --org com.geoattendance --project-name geo_attendance .

      - name: Apply Android permissions and app label
        run: python scripts/prepare_android.py

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Resolve Google Apps Script URL
        id: endpoint
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            URL="${{ inputs.google_script_url }}"
          else
            URL="${{ vars.GOOGLE_SCRIPT_URL }}"
          fi

          if [ -z "$URL" ]; then
            echo "GOOGLE_SCRIPT_URL is not configured."
            exit 1
          fi

          if [[ ! "$URL" =~ ^https://script\.google\.com/macros/s/.+/exec$ ]]; then
            echo "Invalid Google Apps Script URL. It must start with https://script.google.com/macros/s/ and end with /exec"
            exit 1
          fi

          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: flutter build apk --release --dart-define=GOOGLE_SCRIPT_URL="${{ steps.endpoint.outputs.url }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: geo-attendance-google-workspace-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
